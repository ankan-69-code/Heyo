<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message 🌸</title>
    <style>
        /* Base Styles */
        body { 
            background-color: #fff0f3; 
            font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }

        /* Container for both Lock and Content */
        .container {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
            text-align: center;
            border: 4px solid #ffccd5;
            max-width: 800px;
            position: relative;
            z-index: 10;
        }

        h2, h3 { color: #ff758f; margin-top: 0; }

        /* Input Styling */
        input {
            padding: 12px;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            outline: none;
            font-size: 1.2rem;
            text-align: center;
            width: 120px;
            transition: 0.3s;
        }
        input:focus { border-color: #ff758f; box-shadow: 0 0 10px #ffccd5; }

        /* Button Styling */
        button {
            padding: 12px 25px;
            background: #ff758f;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { background: #ff4d6d; transform: scale(1.05); }

        /* Envelope Animation */
        .envelope {
            font-size: 100px;
            cursor: pointer;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Content Grid */
        .items-grid {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out;
        }

        .item {
            background: #fffafa;
            padding: 15px;
            border-radius: 20px;
            border: 2px dashed #ffccd5;
            width: 180px;
            transition: 0.3s;
        }

        .item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 10px;
            background: #eee; /* Placeholder color if image is missing */
        }

        /* The Letter */
        .letter-card {
            background: #fdfae1;
            padding: 20px;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            line-height: 1.5;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
            color: #444;
            text-align: left;
            width: 220px;
        }

        /* Utility Classes */
        .hidden { display: none !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Heart Particles */
        .heart {
            position: fixed;
            color: #ff758f;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="lock-screen" class="container">
        <h2>💖 Private Space</h2>
        <p style="color: #ff8fa3;">Enter the secret 4-digit PIN</p>
        <input type="password" id="pin" placeholder="••••" maxlength="4">
        <br>
        <button onclick="unlock()">Unlock</button>
        <p id="error" style="color: #ff4d6d; font-size: 0.8rem; margin-top: 10px;" class="hidden">Wrong PIN! Try again 🌸</p>
    </div>

    <div id="content" class="container hidden">
        <div id="envelope-wrap">
            <div class="envelope" onclick="openEnvelope()">💌</div>
            <h3 style="margin-top: 10px;">You have a message!</h3>
            <p style="color: #ff758f;">Tap the letter to open</p>
        </div>
        
        <div id="items-list" class="hidden">
            <h3>Something for you...</h3>
            <div class="items-grid">
                <div class="item">
                    <img src="photo1.jpg" alt="Photo 1">
                    <small>Ei dakho 🫠</small>
                </div>
                
                <div class="letter-card">
                    <p>Bubu 😢, Sorry !</p>
                    <p>aar rege thakona bubu darling amar pilijj</p>
                    <p>dakho tomake ghumu korte dekhe koto cutu laagee bubu amar 🫠</p>
                </div>

                <div class="item">
                    <img src="photo2.jpg" alt="Photo 2">
                    <small>kaan dhorchi bubuu 😓</small>
                </div>
            </div>
            <button onclick="location.reload()" style="background: #ddd; color: #666; font-size: 0.7rem;">Lock Again</button>
        </div>
    </div>

    <script>
        // 1. PIN Check Logic
        function unlock() {
            const pinInput = document.getElementById('pin').value;
            const secretPin = "1234"; // CHANGE YOUR PIN HERE

            if (pinInput === secretPin) {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
            } else {
                document.getElementById('error').classList.remove('hidden');
                document.getElementById('pin').value = "";
            }
        }

        // 2. Open Envelope Logic
        function openEnvelope() {
            document.getElementById('envelope-wrap').classList.add('hidden');
            document.getElementById('items-list').classList.remove('hidden');
            createHearts(); // Trigger the "cute" effect
        }

        // 3. Optional "Falling Hearts" Effect
        function createHearts() {
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerHTML = '🌸';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 5000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
